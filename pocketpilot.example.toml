# PocketPilot 配置示例；消息平台按需启用，主机限定允许访问的项目根路径。
# 默认读取 pocketpilot.toml；可用 --config 指定单一 TOML，不支持 include 或 .env。
# 文件路径以本配置文件所在目录为基准。公开示例不包含真实令牌。

# CLI 与后台展示的缺省语言；Telegram 用户偏好通过 /language 独立保存。
language = "zh-CN"

[service]
data_dir = "var/data"

[logging]
format = "json"
filter = "info,app=debug,engine=debug,ssh=info,codex=info,telegram=info"
directory = "var/logs"
rotation = "daily"
retained_files = 14
console = true

[telegram]
# 必填：允许使用 bot 的 Telegram 数字用户 ID；仅接受该用户的本人私聊。
# 替换为自己的 ID；下方是合成示例，不是默认授权账号。
owner_user_id = 123456789
token = "REPLACE_WITH_BOT_TOKEN"
# 空或省略时直连，不继承 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY。
# 仅支持无认证 HTTP CONNECT 代理，例如 http://192.0.2.10:7890。
proxy = ""
# zh-CN / en / auto；用户可通过 /language 独立覆盖。
default_locale = "zh-CN"

# 可选 Discord；默认编译支持。
# 只允许此服务器的 owner 使用。
# [discord]
# token = "REPLACE_WITH_DISCORD_BOT_TOKEN"
# guild_id = 123456789012345678
# proxy = ""

# 可选 Slack：仅与 owner 私聊；安装权限见 docs/integrations.md。
# [slack]
# app_token = "xapp-REPLACE_IN_PRIVATE_CONFIG"
# bot_token = "xoxb-REPLACE_IN_PRIVATE_CONFIG"
# app_id = "A000000001"
# team_id = "T000000001"
# owner_user_id = "U000000001"
# proxy = ""

# 可选国内飞书：企业自建应用 + 长连接；配置步骤见 docs/integrations.md。
# SDK 自动管理 tenant_access_token；只保存 App Secret，不复制短期 token。
# [feishu]
# app_id = "cli_REPLACE_IN_PRIVATE_CONFIG"
# app_secret = "REPLACE_IN_PRIVATE_CONFIG"
# tenant_key = "REPLACE_WITH_TENANT_KEY"
# owner_open_id = "ou_REPLACE_WITH_OWNER_OPEN_ID"
# 飞书固定直连，不允许 proxy 配置；国际 Lark 尚未开放。
# [[feishu.groups]]
# chat_id = "oc_REPLACE_WITH_ALLOWED_GROUP_ID"
# name = "开发测试群"

[[hosts]]
id = "00000000-0000-4000-8000-000000000001"
name = "开发机"
transport = "ssh_proxy"
backend = "auto"
ssh_alias = "pilot-dev"
allowed_workspace_roots = ["/srv/code"]

[hosts.timeouts]
connect_seconds = 90
authenticate_seconds = 120
proxy_ready_seconds = 120
rpc_read_seconds = 60
rpc_write_receipt_seconds = 60
keepalive_seconds = 30
keepalive_missed = 6
reconnect_initial_seconds = 2
reconnect_max_seconds = 120

[hosts.authentication]
max_attempts = 2
# 普通认证继承 SSH config；需要 OTP 时仅在私有配置中启用下段并填 seed。
# [hosts.authentication.totp]
# secret_base32 = "REPLACE_IN_PRIVATE_CONFIG"
# algorithm = "SHA1"
# digits = 6
# period_seconds = 30
# minimum_remaining_seconds = 5
# 匹配挑战文案和可选括号上下文，不嵌入实际用户名、主机名或 IP。
# prompt_patterns = ['(?i)^(?:\([^\r\n()]{1,256}\)\s*)?verification code:\s*$', '(?i)^otp:\s*$']
# password_prompt_patterns = ['(?i)^password:\s*$']

# 可选独立 Claude Code server；只有 hosts bootstrap HOST_ID 才安装并启动。
# 目标账号先正常安装/登录 Claude，artifact 是桥接主机上的 musl 二进制。
# [[hosts.runtime_servers]]
# kind = "claude_code"
# artifact = "dist/pocketpilot-agent-server-x86_64-unknown-linux-musl"
# directory = "~/.pocketpilot"
# agent_binary = "/home/operator/.local/bin/claude"

# Provider 和 workspace 持久化在应用 SQLite，运行时动态发现/管理。
# Codex 可执行文件与现有控制 socket 自动探测，无需手填。

[config_reload]
enabled = true
debounce_ms = 500
periodic_rescan_seconds = 30

[delivery]
burst_window_ms = 2000
burst_threshold = 3
max_flush_delay_ms = 5000
history_barrier_timeout_seconds = 60
messages_per_minute = 18
history_active = "recent_preview"
history_preview_chars = 1200
history_idle = "last_user_and_final"
