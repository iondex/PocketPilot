[package]
name = "slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:slack-morphism", "dep:engine", "dep:sqlx", "dep:serde_json", "dep:uuid", "dep:http"]
test-support = ["runtime"]

[dependencies]
i18n.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
session = { path = "../session" }
engine = { path = "../engine", optional = true }
slack-morphism = { version = "=2.31.0", default-features = false, features = ["hyper"], optional = true }
http = { version = "1", optional = true }
sqlx = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
toml.workspace = true

[lints]
workspace = true
