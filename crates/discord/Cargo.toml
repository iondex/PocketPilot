[package]
name = "discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:serenity", "dep:engine", "dep:sqlx", "dep:serde_json", "dep:uuid"]
test-support = ["runtime"]

[dependencies]
network.workspace = true
i18n.workspace = true
engine = { path = "../engine", optional = true }
sqlx = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
reqwest.workspace = true
async-trait.workspace = true
secrecy.workspace = true
session = { path = "../session" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
serenity = { optional = true, version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
wiremock = "0.6"

[lints]
workspace = true
