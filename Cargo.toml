[workspace]
members = [
    "crates/adapters",
    "crates/agent-server",
    "crates/app",
    "crates/connections",
    "crates/engine",
    "crates/i18n",
    "crates/integrations",
    "crates/session",
]
resolver = "3"
exclude = ["vendor/openlark-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
repository = "https://github.com/iondex/PocketPilot"

[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
glob = "0.3"
i18n = { path = "crates/i18n" }
notify = "8"
prost = "0.14"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rust-i18n = "4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
ssh2-config = { version = "0.8", features = ["nolog"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal", "fs", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
totp-rs = { version = "6", default-features = false, features = ["std", "zeroize"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
openlark-client = { path = "vendor/openlark-client" }
